# ==============================================================================
# Environment Configuration: Demo (demo)
# Target environment for neuro-Deploy demo deployments
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: demo
  labels:
    app: customer-service
    environment: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
      environment: demo
  template:
    metadata:
      labels:
        app: customer-service
        environment: demo
    spec:
      containers:
        - name: customer-service
          # neuro-Deploy updates image name and tag below:
          image: customer-service:1.0.0-demo
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: demo
            - name: SERVER_PORT
              value: "8080"
            # Demo instrumentation settings
            # - name: DEMO_MODE
            #   value: "true"
          resources:
            requests:
              cpu: "500m"
              memory: "1024Mi"
            limits:
              cpu: "1000m"
              memory: "2048Mi"
